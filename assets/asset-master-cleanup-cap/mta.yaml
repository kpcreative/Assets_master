ID: asset-master-cleanup-cap
_schema-version: "3.3"
version: 1.0.0
description: Asset Master Data Governance — CAP Node.js app with HANA, S/4HANA destination, and XSUAA

# ─────────────────────────────────────────────────────────────────────────────
# Modules
# ─────────────────────────────────────────────────────────────────────────────
modules:

  # ── CAP Node.js backend ───────────────────────────────────────────────────
  - name: asset-master-cleanup-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 512M
    build-parameters:
      builder: npm
    properties:
      S4_DESTINATION_NAME: AB1_I769395
      SCAN_CRON_SCHEDULE: "5 6 * * *"
    requires:
      - name: asset-master-cleanup-cap-hdi
      - name: asset-master-cleanup-cap-xsuaa
      - name: BTP_Destination_Service_Training
      - name: I769334_Connectivity_Service
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── AppRouter (handles XSUAA OAuth2 login for browser users) ─────────────
  - name: asset-master-cleanup-cap-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 256M
    requires:
      - name: asset-master-cleanup-cap-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # ── HDI Schema deployer (initialises HANA schema) ─────────────────────────
  - name: asset-master-cleanup-cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
    requires:
      - name: asset-master-cleanup-cap-hdi

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
resources:

  # ── XSUAA (new service for this app) ────────────────────────────────────
  - name: asset-master-cleanup-cap-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: asset-master-cleanup-cap-xsuaa
      path: ./xs-security.json

  # ── SAP HANA HDI container (new) ────────────────────────────────────────
  - name: asset-master-cleanup-cap-hdi
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: asset-master-cleanup-cap-hdi

  # ── Destination Service (existing) ──────────────────────────────────────
  - name: BTP_Destination_Service_Training
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: BTP_Destination_Service_Training

  # ── Connectivity Service (existing) ─────────────────────────────────────
  - name: I769334_Connectivity_Service
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: I769334_Connectivity_Service
